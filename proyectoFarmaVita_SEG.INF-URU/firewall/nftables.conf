#!/usr/sbin/nft -f
# =====================================================================
#  fw-01 · Firewall perimetral FarmaVita
#  Política: denegar todo lo no autorizado explícitamente (forward DROP)
# =====================================================================

flush ruleset

define OFICINAS = { 10.10.210.0/24, 10.10.220.0/24, 10.10.230.0/24, 10.10.240.0/24 }
define DMZ      = 10.10.20.0/24
define APPS     = 10.10.30.0/24
define DATOS    = 10.10.40.0/24

define PROXY    = 10.10.20.10
define BACKEND  = 10.10.30.20
define DB       = 10.10.40.10

table inet filtro {

    # -----------------------------------------------------------------
    # Tráfico dirigido al propio firewall
    # -----------------------------------------------------------------
    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        # Diagnóstico: las subredes internas pueden hacer ping a su gateway
        ip saddr { $OFICINAS, $DMZ, $APPS, $DATOS } icmp type echo-request accept
    }

    # -----------------------------------------------------------------
    # Tráfico que atraviesa el firewall entre segmentos
    # -----------------------------------------------------------------
    chain forward {
        type filter hook forward priority filter; policy drop;

        # 1. Retorno de conexiones ya autorizadas
        ct state established,related accept
        ct state invalid counter drop

        # 2. ANTI-RANSOMWARE: ninguna oficina alcanza la red de datos
        #    (incluye ICMP: el ping hacia 10.10.40.0/24 queda bloqueado)
        ip saddr $OFICINAS ip daddr $DATOS counter drop comment "Oficinas -> Datos: BLOQUEADO"

        # 3. ICMP echo-request sólo desde oficinas hacia DMZ y Apps
        ip saddr $OFICINAS ip daddr { $DMZ, $APPS } icmp type echo-request counter accept comment "Ping oficinas -> DMZ/Apps"

        # 4. Oficinas -> DMZ (intranet) y Apps (API / LDAP)
        ip saddr $OFICINAS ip daddr $DMZ  counter accept comment "Oficinas -> DMZ"
        ip saddr $OFICINAS ip daddr $APPS counter accept comment "Oficinas -> Apps"

        # 5. Proxy inverso de la DMZ -> API NestJS (único flujo DMZ -> Apps)
        ip saddr $PROXY ip daddr $BACKEND tcp dport 3000 counter accept comment "Nginx -> API"

        # 6. Sólo la red de aplicaciones alcanza PostgreSQL
        ip saddr $APPS ip daddr $DB tcp dport 5432 counter accept comment "Apps -> PostgreSQL"

        # 7. Todo lo demás se descarta (política DROP) y se contabiliza
        counter comment "Descartado por politica"
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

# ---------------------------------------------------------------------
# NAT: masquerade para garantizar el retorno simétrico de paquetes.
# Los servidores conservan su gateway Docker por defecto; al enmascarar
# con la IP .254 del firewall, las respuestas vuelven siempre por fw-01.
# ---------------------------------------------------------------------
table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;

        # Requisito: oficinas (210-240) saliendo por eth*
        ip saddr $OFICINAS oifname "eth*" masquerade

        # Flujos internos de servidor autorizados (DMZ->Apps, Apps->Datos)
        ip saddr $DMZ  ip daddr $APPS  oifname "eth*" masquerade
        ip saddr $APPS ip daddr $DATOS oifname "eth*" masquerade
    }
}
