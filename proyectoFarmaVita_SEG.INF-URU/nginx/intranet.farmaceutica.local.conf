# =====================================================================
#  Proxy inverso DMZ · 10.10.20.10 · intranet.farmaceutica.local
# =====================================================================

upstream farma_api {
    server 10.10.30.20:3000;   # farma_backend (VLAN 30) a través de fw-01
    keepalive 16;
}

# Cualquier petición con un Host desconocido se cierra sin respuesta
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name intranet.farmaceutica.local localhost 10.10.20.10;

    root  /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    # Login con limitación de tasa
    location = /api/auth/login {
        limit_req zone=login burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://farma_api/auth/login;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    # API REST -> NestJS (se elimina el prefijo /api)
    location /api/ {
        proxy_pass http://farma_api/;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    # SPA React
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
