user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 1m;

    log_format farmavita '$remote_addr - $remote_user [$time_local] "$host" '
                         '"$request" $status $body_bytes_sent '
                         '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log farmavita;

    # Limitación de intentos de login (fuerza bruta)
    limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
