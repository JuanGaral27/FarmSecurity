[package]
name = "terminal_almacen"
version = "1.0.0"
edition = "2021"
description = "Terminal TUI de Almacén FarmaVita (pc_almacen_01, VLAN 210)"
license = "UNLICENSED"

[dependencies]
ratatui = "0.28"
ureq = { version = "2.10", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
